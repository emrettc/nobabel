<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#8a93a0"/></marker>
    <marker id="ay" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#ffd27a"/></marker>
    <marker id="ab" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#7cc7ff"/></marker>
  </defs>
  <rect width="1200" height="470" rx="24" fill="#0e1218"/>
  <text x="40" y="54" font-size="26" font-weight="700" fill="#f2f4f7">Ses bağlantısı — bir kez ayarlanır</text>
  <text x="40" y="82" font-size="16" fill="#8a93a0">Sanal ses kablosu, NoBabel'in sesini toplantı uygulamasına “mikrofon” olarak verir.</text>

  <!-- toplantı uygulaması -->
  <g transform="translate(40 120)">
    <rect width="300" height="300" rx="18" fill="#171c25" stroke="#2a3240"/>
    <text x="150" y="44" font-size="20" font-weight="700" fill="#f2f4f7" text-anchor="middle">Toplantı uygulaması</text>
    <text x="150" y="68" font-size="14" fill="#8a93a0" text-anchor="middle">Meet · Zoom · Teams</text>
    <g transform="translate(22 192)">
      <rect width="256" height="78" rx="12" fill="#0e1218" stroke="#7cc7ff" stroke-opacity="0.6"/>
      <text x="16" y="28" font-size="14" fill="#8a93a0">🎙 Mikrofon</text>
      <text x="16" y="54" font-size="15" font-weight="700" fill="#7cc7ff">CABLE Output</text>
      <text x="16" y="70" font-size="12" fill="#6f7a89">macOS: BlackHole 16ch</text>
    </g>
    <g transform="translate(22 96)">
      <rect width="256" height="78" rx="12" fill="#0e1218" stroke="#ffd27a" stroke-opacity="0.6"/>
      <text x="16" y="28" font-size="14" fill="#8a93a0">🔈 Hoparlör</text>
      <text x="16" y="54" font-size="15" font-weight="700" fill="#ffd27a">Kendi kulaklığın</text>
      <text x="16" y="70" font-size="12" fill="#6f7a89">“CABLE” seçme!</text>
    </g>
  </g>

  <!-- NoBabel -->
  <g transform="translate(450 150)">
    <rect width="300" height="240" rx="18" fill="#161b24" stroke="#c9a2ff" stroke-opacity="0.6"/>
    <text x="150" y="44" font-size="22" font-weight="800" fill="#f2f4f7" text-anchor="middle">NoBabel</text>
    <text x="150" y="100" font-size="14" fill="#ffd27a" text-anchor="middle">◂ toplantı sesini dinler</text>
    <text x="150" y="122" font-size="14" fill="#ffd27a" text-anchor="middle">→ Türkçe altyazı</text>
    <line x1="40" y1="148" x2="260" y2="148" stroke="#2a3240"/>
    <text x="150" y="194" font-size="14" fill="#7cc7ff" text-anchor="middle">▸ mikrofonunu dinler</text>
    <text x="150" y="216" font-size="14" fill="#7cc7ff" text-anchor="middle">→ çevrilmiş sesi CABLE Input'a</text>
  </g>

  <!-- sen -->
  <g transform="translate(860 120)">
    <rect width="300" height="300" rx="18" fill="#171c25" stroke="#2a3240"/>
    <text x="150" y="44" font-size="20" font-weight="700" fill="#f2f4f7" text-anchor="middle">Sen</text>
    <text x="150" y="68" font-size="14" fill="#8a93a0" text-anchor="middle">kulaklıkla 🎧</text>
    <g transform="translate(22 192)">
      <rect width="256" height="78" rx="12" fill="#0e1218" stroke="#2a3240"/>
      <text x="16" y="34" font-size="15" font-weight="700" fill="#f2f4f7">🎙 Gerçek mikrofonun</text>
      <text x="16" y="58" font-size="13" fill="#8a93a0">Türkçe konuşursun</text>
    </g>
    <g transform="translate(22 96)">
      <rect width="256" height="78" rx="12" fill="#0e1218" stroke="#2a3240"/>
      <text x="16" y="34" font-size="15" font-weight="700" fill="#f2f4f7">👀 Köşedeki panel</text>
      <text x="16" y="58" font-size="13" fill="#8a93a0">Türkçe altyazıyı okursun</text>
    </g>
  </g>

  <!-- oklar -->
  <path d="M342 255H444" stroke="#ffd27a" stroke-width="2.5" marker-end="url(#ay)"/>
  <text x="393" y="244" font-size="12" fill="#ffd27a" text-anchor="middle">karşı tarafın sesi</text>
  <path d="M448 351H346" stroke="#7cc7ff" stroke-width="2.5" marker-end="url(#ab)"/>
  <text x="397" y="340" font-size="12" fill="#7cc7ff" text-anchor="middle">çevrilmiş sesin</text>
  <path d="M752 255H856" stroke="#ffd27a" stroke-width="2.5" marker-end="url(#ay)"/>
  <text x="804" y="244" font-size="12" fill="#ffd27a" text-anchor="middle">altyazı</text>
  <path d="M858 351H754" stroke="#7cc7ff" stroke-width="2.5" marker-end="url(#ab)"/>
  <text x="806" y="340" font-size="12" fill="#7cc7ff" text-anchor="middle">Türkçe sesin</text>
</svg>
