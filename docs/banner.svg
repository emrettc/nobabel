<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0f15"/>
      <stop offset="1" stop-color="#18202d"/>
    </linearGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd27a"/>
      <stop offset="1" stop-color="#7cc7ff"/>
    </linearGradient>
    <linearGradient id="word" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#c9d6e8"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="380" rx="24" fill="url(#bg)"/>
  <!-- ince ızgara -->
  <g stroke="#ffffff" stroke-opacity="0.035">
    <path d="M0 76H1200M0 152H1200M0 228H1200M0 304H1200"/>
    <path d="M150 0V380M300 0V380M450 0V380M600 0V380M750 0V380M900 0V380M1050 0V380"/>
  </g>

  <!-- logo: iki konuşma balonu, ortada ⇄ -->
  <g transform="translate(70 92)">
    <rect width="132" height="132" rx="34" fill="url(#mark)"/>
    <path d="M30 40h50a12 12 0 0 1 12 12v18a12 12 0 0 1-12 12H52l-14 12v-12h-8a12 12 0 0 1-12-12V52a12 12 0 0 1 12-12z" fill="#0b0f15" opacity="0.9"/>
    <path d="M60 62h44a12 12 0 0 1 12 12v16a12 12 0 0 1-12 12h-6v12l-14-12H60a12 12 0 0 1-12-12V74a12 12 0 0 1 12-12z" fill="#0b0f15" opacity="0.55"/>
    <text x="54" y="70" font-size="22" font-weight="700" fill="#ffd27a" text-anchor="middle">EN</text>
    <text x="84" y="94" font-size="20" font-weight="700" fill="#7cc7ff" text-anchor="middle">TR</text>
  </g>

  <text x="232" y="168" font-size="86" font-weight="800" fill="url(#word)" letter-spacing="-2">NoBabel</text>
  <text x="236" y="214" font-size="27" fill="#aeb8c6">Toplantılarda dil engeli yok — canlı, iki yönlü çeviri.</text>

  <!-- rozetler -->
  <g font-size="17" font-weight="600">
    <g transform="translate(236 246)">
      <rect width="150" height="36" rx="18" fill="#ffd27a" fill-opacity="0.12" stroke="#ffd27a" stroke-opacity="0.5"/>
      <text x="75" y="24" text-anchor="middle" fill="#ffd27a">Türkçe ⇄ 8 dil</text>
    </g>
    <g transform="translate(398 246)">
      <rect width="150" height="36" rx="18" fill="#7cc7ff" fill-opacity="0.12" stroke="#7cc7ff" stroke-opacity="0.5"/>
      <text x="75" y="24" text-anchor="middle" fill="#7cc7ff">Canlı altyazı</text>
    </g>
    <g transform="translate(560 246)">
      <rect width="140" height="36" rx="18" fill="#c9a2ff" fill-opacity="0.12" stroke="#c9a2ff" stroke-opacity="0.5"/>
      <text x="70" y="24" text-anchor="middle" fill="#c9a2ff">Doğal ses</text>
    </g>
    <g transform="translate(712 246)">
      <rect width="150" height="36" rx="18" fill="#7be3a6" fill-opacity="0.12" stroke="#7be3a6" stroke-opacity="0.5"/>
      <text x="75" y="24" text-anchor="middle" fill="#7be3a6">Çevrimdışı</text>
    </g>
  </g>
  <text x="236" y="328" font-size="17" fill="#6f7a89">Google Meet · Zoom · Microsoft Teams · Windows &amp; macOS</text>

  <!-- sağda dalga formu + balonlar -->
  <g transform="translate(905 70)">
    <rect x="0" y="0" width="250" height="78" rx="18" fill="#161b24" stroke="#ffd27a" stroke-opacity="0.45"/>
    <text x="18" y="32" font-size="15" fill="#ffd27a" font-weight="700">EN · karşı taraf</text>
    <text x="18" y="58" font-size="15" fill="#e8edf4">“Lead time is 3 weeks.”</text>
    <g transform="translate(110 96)" stroke="url(#mark)" stroke-width="5" stroke-linecap="round">
      <path d="M0 22v8M12 14v24M24 4v44M36 12v28M48 18v16"/>
    </g>
    <rect x="0" y="162" width="250" height="78" rx="18" fill="#161b24" stroke="#7cc7ff" stroke-opacity="0.45"/>
    <text x="18" y="194" font-size="15" fill="#7cc7ff" font-weight="700">TR · altyazı</text>
    <text x="18" y="220" font-size="15" fill="#e8edf4">“Teslim süresi 3 hafta.”</text>
  </g>
</svg>
